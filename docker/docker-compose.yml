# HvPortal gateway on Docker (Portainer: Stacks > Add stack > Web editor, paste this file, load docker/.env.example
# under "Environment variables" and fill in the values). The image must exist on the Docker host or in your registry:
#   docker build -f docker/Dockerfile -t hvportal-gateway:0.6.0 .        (from the repository root)
# Hyper-V hosts keep the Windows agent; it connects to this container on HVP_AGENT_PORT (mutual TLS, no proxy).

name: hvportal

services:
  gateway:
    image: ${HVP_IMAGE:-hvportal-gateway:0.6.0}
    # The image is private (not on Docker Hub): import it on the Docker host first (Portainer > Images > Import,
    # or docker load). "never" = use the local image, never try to pull it. With a private registry use "missing"/"always".
    pull_policy: ${HVP_PULL_POLICY:-never}
    container_name: hvportal-gateway
    restart: unless-stopped
    # Same port inside and outside the container: the portal shows these numbers in the agent install commands.
    ports:
      - "${HVP_UI_PORT:-8443}:${HVP_UI_PORT:-8443}"         # web console, REST API (HTTPS)
      - "${HVP_AGENT_PORT:-8444}:${HVP_AGENT_PORT:-8444}"   # agent channel (mTLS) - TCP straight to the container, never through a TLS-terminating proxy
    environment:
      Gateway__UiPort: "${HVP_UI_PORT:-8443}"
      Gateway__AgentPort: "${HVP_AGENT_PORT:-8444}"
      # Names/IPs the Hyper-V hosts use to reach the gateway (put in the agent-channel certificate).
      HVP_PUBLIC_NAMES: "${HVP_PUBLIC_NAMES:?Set HVP_PUBLIC_NAMES (DNS names and/or IPs of the Docker host, comma separated)}"
      # Key-encryption key of the gateway key ring (32 random bytes, base64: openssl rand -base64 32).
      # KEEP IT: without it the data volume cannot be opened. Change it only by restoring a portal backup.
      HVP_KEY_ENCRYPTION_KEY: "${HVP_KEY_ENCRYPTION_KEY:?Set HVP_KEY_ENCRYPTION_KEY (openssl rand -base64 32)}"
      # First start only: print the one-time setup token in the container log (Portainer > Containers > Logs).
      HVP_PRINT_SETUP_TOKEN: "${HVP_PRINT_SETUP_TOKEN:-true}"
      # Optional certificate for the web console (otherwise the internal CA certificate is used: browsers warn).
      Gateway__UiCertificatePath: "${HVP_UI_CERT_PATH:-}"
      Gateway__UiCertificateKeyPath: "${HVP_UI_CERT_KEY_PATH:-}"
      Gateway__UiCertificatePassword: "${HVP_UI_CERT_PASSWORD:-}"
      TZ: "${TZ:-Europe/Rome}"
    volumes:
      - hvportal-data:/data                 # database, key ring, internal CA, Data Protection keys
      - ${HVP_CERTS_DIR:-./certs}:/certs:ro # optional: portal.pfx or portal.crt + portal.key for the web console
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "dotnet", "/app/HvPortal.Gateway.dll", "admin", "health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hvportal-data:
    name: hvportal-data
